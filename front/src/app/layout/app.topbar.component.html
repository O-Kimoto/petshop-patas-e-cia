<div class="layout-topbar">
    <a class="layout-topbar-logo" routerLink="">
        <img src="assets/layout/images/logo-petshop.svg" alt="logo">
        <span>Patas &amp; Cia</span>
    </a>

    <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()">
        <i class="pi pi-bars"></i>
    </button>

    <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button" (click)="layoutService.showProfileSidebar()">
        <i class="pi pi-ellipsis-v"></i>
    </button>

    <!-- Usuário logado (lido do token) e botão de sair - [Otávio Michels] -->
    <div #topbarmenu class="layout-topbar-menu align-items-center" [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
        <span class="flex align-items-center gap-2 px-3 text-700" *ngIf="usuario">
            <i class="pi pi-user"></i>
            <span class="font-medium">{{ usuario.nome || usuario.username }}</span>
        </span>
        <button class="p-link layout-topbar-button" title="Sair" (click)="logout()">
            <i class="pi pi-sign-out"></i>
            <span>Sair</span>
        </button>
    </div>
</div>
