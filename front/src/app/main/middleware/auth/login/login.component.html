<div class="surface-ground flex align-items-center justify-content-center min-h-screen px-3 py-5">
    <div class="w-full" style="max-width: 30rem">
        <div class="text-center mb-4">
            <img src="assets/layout/images/logo-petshop.svg" alt="Patas & Cia" class="w-5rem mb-2">
            <div class="text-900 text-3xl font-bold">Patas &amp; Cia</div>
            <span class="text-600">Sistema de gestão do petshop</span>
        </div>

        <div class="surface-card shadow-2 border-round-2xl p-4 sm:p-6">
            <div class="text-900 text-2xl font-medium mb-1">Entrar</div>
            <p class="text-600 mt-0 mb-4">Use seu usuário e senha para acessar.</p>

            <div *ngIf="sessaoExpirada" class="p-3 mb-4 border-round bg-orange-50 text-orange-900">
                <i class="pi pi-clock mr-2"></i>Sua sessão expirou. Entre novamente.
            </div>

            <!-- Formulário de login; Enter envia - [Otávio Michels] -->
            <form (ngSubmit)="login()" class="p-fluid">
                <div class="field">
                    <label for="username" class="font-medium">Usuário</label>
                    <input id="username" name="username" type="text" pInputText [(ngModel)]="username"
                        placeholder="Seu usuário" autocomplete="username" autofocus />
                </div>
                <div class="field mb-4">
                    <label for="password" class="font-medium">Senha</label>
                    <p-password inputId="password" name="password" [(ngModel)]="password" [feedback]="false"
                        [toggleMask]="true" placeholder="Sua senha"></p-password>
                </div>
                <button pButton pRipple type="submit" label="Entrar" icon="pi pi-sign-in" [loading]="loading"
                    class="p-3 text-lg"></button>
            </form>
        </div>

        <div class="text-center mt-4 text-500 text-sm">
            <a [href]="docsUrl" target="_blank" class="text-500"><i class="pi pi-book mr-1"></i>Documentação da API (Swagger)</a>
        </div>
    </div>
</div>
