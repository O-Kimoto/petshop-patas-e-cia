<div class="grid">
    <div class="col-12">
        <div class="card px-4 py-4 md:px-6 md:py-5">
            <p-toolbar styleClass="mb-4 gap-2">
                <ng-template pTemplate="left">
                    <div class="flex flex-wrap gap-2">
                        <button pButton pRipple label="Novo produto" icon="pi pi-plus" class="p-button-success"
                            (click)="abrirNovo()"></button>
                        <p-dropdown [options]="categorias" [(ngModel)]="filtroCategoria" (onChange)="carregar()"
                            [showClear]="true" placeholder="Todas as categorias" styleClass="w-full sm:w-14rem"></p-dropdown>
                    </div>
                </ng-template>
                <ng-template pTemplate="right">
                    <button pButton pRipple label="Exportar CSV" icon="pi pi-download"
                        class="p-button-help p-button-outlined" (click)="dt.exportCSV()"></button>
                </ng-template>
            </p-toolbar>

            <p-table #dt [value]="produtos" [columns]="colunasCsv" exportFilename="produtos" [loading]="carregando"
                responsiveLayout="stack" breakpoint="1200px" [rows]="10" [paginator]="true"
                [rowsPerPageOptions]="[10, 20, 50]" [showCurrentPageReport]="true"
                currentPageReportTemplate="{first} a {last} de {totalRecords} produtos"
                [globalFilterFields]="['nome', 'descricao', 'categoria']" [rowHover]="true" dataKey="id">
                <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center gap-2">
                        <h5 class="m-0">Produtos</h5>
                        <span class="block p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="onGlobalFilter(dt, $event)"
                                placeholder="Buscar produto..." class="w-full sm:w-20rem" />
                        </span>
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="nome">Nome <p-sortIcon field="nome"></p-sortIcon></th>
                        <th pSortableColumn="categoria">Categoria <p-sortIcon field="categoria"></p-sortIcon></th>
                        <th pSortableColumn="preco">Preço <p-sortIcon field="preco"></p-sortIcon></th>
                        <th pSortableColumn="estoque">Estoque <p-sortIcon field="estoque"></p-sortIcon></th>
                        <th class="text-right">Ações</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-produto>
                    <tr>
                        <td>
                            <span class="p-column-title">Nome</span>
                            <div>
                                <div class="font-medium">{{ produto.nome }}</div>
                                <small class="text-600" *ngIf="produto.descricao">{{ produto.descricao }}</small>
                            </div>
                        </td>
                        <td><span class="p-column-title">Categoria</span>{{ produto.categoria || '—' }}</td>
                        <td><span class="p-column-title">Preço</span>{{ produto.preco | currency:'BRL' }}</td>
                        <td>
                            <span class="p-column-title">Estoque</span>
                            <p-tag [value]="produto.estoque === 0 ? 'Sem estoque' : produto.estoque + ' un.'"
                                [severity]="severidadeEstoque(produto.estoque)"></p-tag>
                        </td>
                        <td>
                            <span class="p-column-title">Ações</span>
                            <div class="flex md:justify-content-end gap-2">
                                <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success"
                                    pTooltip="Editar" (click)="editar(produto)"></button>
                                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"
                                    pTooltip="Excluir" (click)="excluir(produto)"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr><td colspan="5" class="text-center p-4">Nenhum produto encontrado.</td></tr>
                </ng-template>
            </p-table>
        </div>

        <p-dialog [(visible)]="produtoDialog" [style]="{ width: '520px' }" [breakpoints]="{ '600px': '95vw' }"
            [header]="produto.id ? 'Editar produto' : 'Novo produto'" [modal]="true" class="p-fluid">
            <ng-template pTemplate="content">
                <div class="field">
                    <label for="nome">Nome *</label>
                    <input type="text" pInputText id="nome" [(ngModel)]="produto.nome" autofocus
                        [ngClass]="{ 'campo-invalido': submitted && !produto.nome }" />
                    <small class="p-error" *ngIf="submitted && !produto.nome">Nome é obrigatório</small>
                </div>
                <div class="field">
                    <label for="descricao">Descrição</label>
                    <textarea pInputTextarea id="descricao" [(ngModel)]="produto.descricao" rows="3"
                        [autoResize]="true"></textarea>
                </div>
                <div class="field">
                    <label for="categoria">Categoria</label>
                    <p-dropdown inputId="categoria" appendTo="body" [options]="categorias" [(ngModel)]="produto.categoria"
                        [editable]="true" [showClear]="true" placeholder="Escolha ou digite"></p-dropdown>
                </div>
                <div class="formgrid grid">
                    <div class="field col-12 sm:col-6">
                        <label for="preco">Preço *</label>
                        <p-inputNumber inputId="preco" [(ngModel)]="produto.preco" mode="currency" currency="BRL"
                            locale="pt-BR" [min]="0"
                            [ngClass]="{ 'campo-invalido': submitted && produto.preco == null }"></p-inputNumber>
                        <small class="p-error" *ngIf="submitted && produto.preco == null">Preço é obrigatório</small>
                    </div>
                    <div class="field col-12 sm:col-6">
                        <label for="estoque">Estoque *</label>
                        <p-inputNumber inputId="estoque" [(ngModel)]="produto.estoque" [min]="0" [showButtons]="true"
                            suffix=" un." [ngClass]="{ 'campo-invalido': submitted && produto.estoque == null }"></p-inputNumber>
                        <small class="p-error" *ngIf="submitted && produto.estoque == null">Estoque é obrigatório</small>
                    </div>
                </div>
            </ng-template>

            <ng-template pTemplate="footer">
                <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-text"
                    (click)="produtoDialog = false"></button>
                <button pButton pRipple label="Salvar" icon="pi pi-check" [loading]="salvando"
                    (click)="salvar()"></button>
            </ng-template>
        </p-dialog>
    </div>
</div>
