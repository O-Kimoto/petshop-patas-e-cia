<div class="grid">
    <div class="col-12">
        <div class="card px-4 py-4 md:px-6 md:py-5">
            <p-toolbar styleClass="mb-4 gap-2">
                <ng-template pTemplate="left">
                    <button pButton pRipple label="Novo usuário" icon="pi pi-user-plus" class="p-button-success"
                        (click)="abrirNovo()"></button>
                </ng-template>
            </p-toolbar>

            <p-table [value]="usuarios" [loading]="carregando" responsiveLayout="stack" breakpoint="1200px"
                [rows]="10" [paginator]="true" [rowHover]="true" dataKey="id">
                <ng-template pTemplate="caption">
                    <h5 class="m-0">Usuários do sistema</h5>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="nome">Nome <p-sortIcon field="nome"></p-sortIcon></th>
                        <th pSortableColumn="username">Login <p-sortIcon field="username"></p-sortIcon></th>
                        <th>Criado em</th>
                        <th class="text-right">Ações</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-u>
                    <tr>
                        <td>
                            <span class="p-column-title">Nome</span>
                            <span>
                                <span class="font-medium">{{ u.nome || '—' }}</span>
                                <p-tag *ngIf="u.id === idLogado" value="você" severity="info" styleClass="ml-2"></p-tag>
                            </span>
                        </td>
                        <td><span class="p-column-title">Login</span>{{ u.username }}</td>
                        <!-- O SQLite grava CURRENT_TIMESTAMP em UTC; o "Z" faz o navegador converter para o fuso local - [Otávio Michels] -->
                        <td><span class="p-column-title">Criado em</span>{{ u.criado_em ? (u.criado_em.replace(' ', 'T') + 'Z' | date:'dd/MM/yyyy HH:mm') : '—' }}</td>
                        <td>
                            <span class="p-column-title">Ações</span>
                            <div class="flex md:justify-content-end gap-2">
                                <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success"
                                    pTooltip="Editar" (click)="editar(u)"></button>
                                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"
                                    [disabled]="u.id === idLogado" pTooltip="Excluir" (click)="excluir(u)"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>

        <p-dialog [(visible)]="usuarioDialog" [style]="{ width: '440px' }" [breakpoints]="{ '520px': '95vw' }"
            [header]="usuario.id ? 'Editar usuário' : 'Novo usuário'" [modal]="true" class="p-fluid">
            <ng-template pTemplate="content">
                <div class="field">
                    <label for="nome">Nome *</label>
                    <input type="text" pInputText id="nome" [(ngModel)]="usuario.nome" autofocus
                        [ngClass]="{ 'campo-invalido': submitted && !usuario.nome }" />
                    <small class="p-error" *ngIf="submitted && !usuario.nome">Nome é obrigatório</small>
                </div>
                <div class="field">
                    <label for="username">Login *</label>
                    <input type="text" pInputText id="username" [(ngModel)]="usuario.username" autocomplete="off"
                        [ngClass]="{ 'campo-invalido': submitted && !usuario.username }" />
                    <small class="p-error" *ngIf="submitted && !usuario.username">Login é obrigatório</small>
                </div>
                <div class="field">
                    <label for="senha">{{ usuario.id ? 'Nova senha' : 'Senha *' }}</label>
                    <input type="password" pInputText id="senha" [(ngModel)]="usuario.password" autocomplete="new-password"
                        [placeholder]="usuario.id ? 'Deixe vazio para manter a atual' : 'Mínimo de 6 caracteres'"
                        [ngClass]="{ 'campo-invalido': submitted && senhaInvalida }" />
                    <small class="p-error" *ngIf="submitted && senhaInvalida">A senha precisa ter pelo menos 6 caracteres</small>
                </div>
            </ng-template>

            <ng-template pTemplate="footer">
                <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-text"
                    (click)="usuarioDialog = false"></button>
                <button pButton pRipple label="Salvar" icon="pi pi-check" [loading]="salvando"
                    (click)="salvar()"></button>
            </ng-template>
        </p-dialog>
    </div>
</div>
